<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tính Tiền Công Thợ</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mut:#6b7488;--bd:#e3e8f2;--ac:#4f46e5;--ac2:#eef0ff;--ok:#059669;--dg:#dc2626;--sh:0 2px 10px rgba(30,40,80,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2132;--tx:#e8ecf6;--mut:#9aa4bd;--bd:#2a3350;--ac:#818cf8;--ac2:#252b4a;--ok:#34d399;--dg:#f87171;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2132;--tx:#e8ecf6;--mut:#9aa4bd;--bd:#2a3350;--ac:#818cf8;--ac2:#252b4a;--ok:#34d399;--dg:#f87171;--sh:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#4f46e5;z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#4f46e5;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px}
header h1{font-size:1.05rem;margin:0;font-weight:700}
header small{opacity:.85;display:block;font-size:.75rem}
.gt{margin-left:auto;text-align:right}.gt b{font-size:1.3rem;display:block}
#burger{background:rgba(255,255,255,.18);border:0;color:#fff;width:40px;height:40px;border-radius:10px;font-size:1.3rem;cursor:pointer}
.layout{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;padding:14px;align-items:start}
nav{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;box-shadow:var(--sh)}
nav h4{margin:4px 8px 8px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tab{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--tx);padding:10px;border-radius:10px;font:inherit;font-size:.95rem;cursor:pointer}
.tab span{flex:none;width:26px;height:26px;border-radius:8px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.tab:hover{background:var(--ac2)}
.tab.on{background:var(--ac);color:#fff}.tab.on span{background:rgba(255,255,255,.25);color:#fff}
#ov{display:none}
.content{display:grid;gap:14px;min-width:0}
@media(min-width:1000px){.content{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}}
@media(max-width:820px){
 .layout{grid-template-columns:1fr;padding:10px}
 nav{position:fixed;z-index:25;top:0;left:0;bottom:0;width:260px;border-radius:0 16px 16px 0;padding-top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-105%);transition:transform .2s}
 body.open nav{transform:none}
 body.open #ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:24}
}
@media(min-width:821px){#burger{display:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:14px}
.ctitle{font-size:1.1rem;font-weight:700;margin:0 0 4px}
.grp{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:10px}
.grp h3{margin:0 0 6px;font-size:.95rem;display:flex;justify-content:space-between;color:var(--ac)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 110px 100px;column-gap:10px;align-items:center;padding:7px 10px;border-top:1px dashed var(--bd)}
.row.lop{background:var(--ac2);border:0;border-radius:10px;padding:8px 10px;margin:6px 0;font-weight:600}
.row label{grid-column:1;grid-row:1}.row input{grid-column:2;grid-row:1}.row .amt{grid-column:3;grid-row:1}
.row.lop input{grid-row:1!important}
.row.lop:first-child{margin-top:0}
.row label{font-size:.9rem}.row label i{display:block;font-style:normal;color:var(--mut);font-size:.72rem;font-weight:400}
input{width:100%;height:42px;font:inherit;font-size:1rem;padding:0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);text-align:right}
input:focus{outline:2px solid var(--ac);border-color:transparent}
.amt{text-align:right;font-weight:600;font-size:.88rem;font-variant-numeric:tabular-nums;color:var(--ok)}
@media(max-width:520px){
 .row{grid-template-columns:minmax(0,1fr) 120px}
 .row input{grid-column:2;grid-row:1/3}
 .row .amt{grid-column:1;grid-row:2;text-align:left;font-size:.82rem}
 .row.lop input{grid-row:1/3!important}
}
.tot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;font-weight:700}
.tot span:last-child{color:var(--ok);font-size:1.4rem}
.btns{display:flex;gap:8px;margin-top:10px}
button.pri,button.sec{flex:1;font:inherit;font-weight:600;padding:12px;border-radius:12px;border:0;cursor:pointer}
button.pri{background:var(--ac);color:#fff}button.sec{background:var(--ac2);color:var(--ac);flex:.45}
h2{font-size:1rem;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:var(--ac2);border-radius:10px;padding:4px 10px;font-size:.76rem}.chip b{display:block;font-size:.82rem}
.hist{display:grid;gap:8px;max-height:65vh;overflow:auto}
.it{border:1px solid var(--bd);border-radius:12px;padding:9px 10px}
.it .top{display:flex;gap:10px;align-items:center}
.no{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.it .m{flex:1;min-width:0}.it .n{font-weight:600;font-size:.92rem}.it .t{font-size:.72rem;color:var(--mut)}
.it .v{color:var(--ok);font-weight:700;white-space:nowrap}
.it details{font-size:.78rem;color:var(--mut);margin-top:6px}
.it details div{display:flex;justify-content:space-between;padding:1px 0}
.del{margin-top:8px;border:1px solid var(--dg);background:none;color:var(--dg);border-radius:8px;font:inherit;font-size:.78rem;padding:4px 10px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:.9rem}
.link{background:none;border:0;color:var(--dg);font:inherit;font-size:.82rem;cursor:pointer;margin-top:8px}

body{background-image:linear-gradient(180deg,color-mix(in srgb,var(--c,#4f46e5) 14%,transparent),transparent 320px);background-repeat:no-repeat}
header{background:linear-gradient(100deg,#4338ca,#9333ea 55%,#ec4899);box-shadow:0 4px 16px rgba(147,51,234,.35)}
body::before{background:#4338ca}
.gt b{text-shadow:0 1px 8px rgba(0,0,0,.25)}
nav{border-top:4px solid #9333ea}
.tab span{background:color-mix(in srgb,var(--tc) 20%,transparent);color:var(--tc)}
.tab:hover{background:color-mix(in srgb,var(--tc) 12%,transparent)}
.tab.on{background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--tc) 45%,transparent)}
.tab.on span{background:rgba(255,255,255,.28);color:#fff}
.content>.card:first-child{border-top:5px solid var(--c)}
.ctitle{font-size:1.3rem;color:var(--c)}
.grp{border-color:color-mix(in srgb,var(--c) 30%,var(--bd));border-left:4px solid var(--c)}
.grp h3{color:var(--c)}
.row.lop{background:color-mix(in srgb,var(--c) 16%,transparent)}
input:focus{outline-color:var(--c)}
input:not(:placeholder-shown){border-color:var(--c);font-weight:600}
.tot{background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:12px;padding:10px 12px}
.tot span:last-child{background:linear-gradient(90deg,var(--c),#10b981);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.55rem}
button.pri{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent)}
button.sec{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.no{background:var(--tc);box-shadow:0 3px 8px color-mix(in srgb,var(--tc) 50%,transparent)}
.it{border-left:5px solid var(--tc)}
.chip{background:color-mix(in srgb,var(--tc) 16%,transparent);border-left:3px solid var(--tc)}
.del{background:color-mix(in srgb,var(--dg) 10%,transparent)}.del:hover{background:var(--dg);color:#fff}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,12,30,.6);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.dlg{width:100%;max-width:360px;background:var(--card);border-radius:22px;padding:26px 22px 20px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45);animation:pop .22s ease-out;border-top:6px solid var(--dg)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:none}}
.dlg .ic{width:64px;height:64px;margin:-52px auto 12px;border-radius:50%;background:linear-gradient(135deg,#f87171,#dc2626);display:grid;place-items:center;font-size:1.8rem;box-shadow:0 8px 20px rgba(220,38,38,.45);border:4px solid var(--card)}
.dlg h3{margin:0 0 6px;font-size:1.2rem}
.dlg p{margin:0 0 18px;color:var(--mut);font-size:.9rem;white-space:pre-line}
.mb{display:flex;gap:10px}
.mb button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:0;cursor:pointer}
.mb .cancel{background:var(--ac2);color:var(--tx)}
.mb .danger{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.4)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#1f2937;color:#fff;padding:11px 18px;border-radius:999px;font-size:.9rem;font-weight:600;z-index:60;transition:.25s;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.ok{background:#059669}
.tot{margin-top:6px}.btns{margin:10px 0 14px}
</style>
</head>
<body>
<header>
  <button id="burger" aria-label="Menu">&#9776;</button>
  <div><h1>Tính Tiền Công Thợ</h1><small id="cnt">0 lần đã lưu</small></div>
  <div class="gt"><small>Tổng tất cả</small><b id="gt">0 đ</b></div>
</header>
<div id="ov"></div>
<div id="md" class="modal"><div class="dlg" role="alertdialog"><div class="ic">🗑️</div><h3 id="mt"></h3><p id="mm"></p><div class="mb"><button id="mc" class="cancel">Hủy</button><button id="mo" class="danger">Xóa</button></div></div></div>
<div id="toast"></div>
<div class="layout">
  <nav><h4>Chức năng</h4><div id="tabs"></div></nav>
  <div class="content">
    <section class="card"><div class="ctitle" id="ct"></div><div id="calc"></div></section>
    <section class="card">
      <h2>Các lần đã lưu</h2>
      <div class="chips" id="chips"></div>
      <div class="hist" id="hist"></div>
      <button class="link" id="clr">Xóa toàn bộ</button>
    </section>
  </div>
</div>
<script>
// [nhãn, đơn giá, nhân với Số Lớp?]
const CATS=[
{id:'cat',name:'Tiền Cắt',groups:[
 {t:'Đồ bé',lop:'Số Lớp',rows:[['Số Size đồ bé',500,1],['Số Lớp lẻ',500,0]]},
 {t:'Đồ lớn',lop:'Số Lớp',rows:[['Số Size',1000,1],['Số Lớp lẻ',1000,0]]},
 {t:'Ngày công',rows:[['Số ngày công',100000,0]]}]},
{id:'may',name:'Tiền May',lop:'Số Lớp',groups:[
 {t:'Thường',rows:[['Số Size 0 => 7',5500,1],['Số Size 8 => 18',6000,1],['Số Lớp 0 => 7 lẻ',5500,0],['Số Lớp 8 => 18 lẻ',6000,0]]},
 {t:'Đùi',rows:[['Số Size 0 => 7 ĐÙI',6000,1],['Số Size 8 => 18 ĐÙI',6500,1],['Số Lớp 0 => 7 Đùi lẻ',6000,0],['Số Lớp 8 => 18 Đùi lẻ',6500,0]]},
 {t:'Vét',rows:[['Vét 0 => 7',6000,0],['Vét 0 => 7 ĐÙI',6500,0]]}]},
{id:'khuy',name:'Tiền Khuy A Minh',lop:'Số Lớp',groups:[
 {t:'Khuy',rows:[['Số Size 1 nút',500,1],['Số Size 4 nút',2000,0],['Số Size 1 nút lẻ',500,0]]}]},
{id:'ui',name:'Tiền Ủi',lop:'Số Lớp',groups:[
 {t:'Ủi',rows:[['Số Size 0 => 16',1100,1],['Số Size 17 => 18',1600,1],['Đồ lớn',1600,1],['Nhung',2100,1],['Số Size 0 => 16 lẻ',1100,0]]}]},
{id:'uiam',name:'Tiền Ủi A Minh',lop:'Số Lớp',groups:[
 {t:'Thường',rows:[['Số Size 0 => 12',1200,1],['Số Size 13 => 18',1600,1],['Số Size 0 => 12 lẻ',1200,0]]},
 {t:'Nút',rows:[['Số Size 0 => 12 Nút',1700,1],['Số Size 13 => 18 Nút',2100,1],['Số Size 0 => 12 Nút lẻ',1700,0]]}]},
{id:'diep',name:'C Diệp',lop:'Số Lớp',groups:[
 {t:'Trai',rows:[['Số Size 0 => 7 trai',7000,1],['Số Size 8 => 18 trai',7500,1],['Số Size 0 => 7 lẻ trai',7000,0],['Số Size 8 => 18 lẻ trai',7500,0]]},
 {t:'Gái',rows:[['Số Size 0 => 7 gái',6600,1],['Số Size 8 => 18 gái',7100,1],['Số Size 0 => 7 lẻ gái',6600,0],['Số Size 8 => 18 lẻ gái',7100,0]]},
 {t:'Đùi / Lửng',rows:[['Số Size Đùi lớn',9600,1],['Số Size lửng, td',10100,1],['Số Size Đùi lớn lẻ',9600,0],['Số Size lửng, td lẻ',10100,0]]}]}
];
const COL={cat:'#f97316',may:'#8b5cf6',khuy:'#ec4899',ui:'#0ea5e9',uiam:'#10b981',diep:'#f43f5e'};
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('vi-VN')+' đ';
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:0};
let cur=CATS[0].id, vals={}, saved=[];
try{saved=JSON.parse(localStorage.getItem('ttct_saved')||'[]')}catch(e){}
const persist=()=>{try{localStorage.setItem('ttct_saved',JSON.stringify(saved))}catch(e){}};
const cat=()=>CATS.find(c=>c.id===cur);

function compute(c){
  const v=vals[c.id]||{}; let total=0; const groups=[];
  c.groups.forEach((g,gi)=>{
    const lop=num(g.lop?v['g'+gi]:v.lop); let sub=0; const lines=[];
    g.rows.forEach((r,ri)=>{
      const q=num(v[gi+'_'+ri]); const amt=(r[2]?lop*q:q)*r[1];
      sub+=amt; lines.push({k:gi+'_'+ri,l:r[0],q,amt});
    });
    groups.push({lines,sub,lop}); total+=sub;
  });
  return {groups,total};
}
function renderCalc(){
  const c=cat(); $('ct').textContent=c.name; document.documentElement.style.setProperty('--c',COL[c.id]); const v=vals[c.id]||(vals[c.id]={});
  let h=`<div class="tot"><span>Tổng Tiền</span><span id="tt">0 đ</span></div>
  <div class="btns"><button class="sec" id="rs">Xóa nhập</button><button class="pri" id="sv">Lưu kết quả</button></div>`;
  if(c.lop) h+=`<div class="grp" style="margin-top:0"><div class="row lop"><label for="ilop">${c.lop}</label><input id="ilop" type="number" inputmode="numeric" min="0" data-k="lop" value="${v.lop??''}" placeholder="0"></div></div>`;
  c.groups.forEach((g,gi)=>{
    h+=`<div class="grp"><h3><span>${g.t}</span><span id="s${gi}">0 đ</span></h3>`;
    if(g.lop) h+=`<div class="row lop"><label for="ig${gi}">${g.lop}</label><input id="ig${gi}" type="number" inputmode="numeric" min="0" data-k="g${gi}" value="${v['g'+gi]??''}" placeholder="0"></div>`;
    g.rows.forEach((r,ri)=>{
      const k=gi+'_'+ri;
      h+=`<div class="row"><label for="i${k}">${r[0]}<i>${r[2]?'Số Lớp × ':''}đơn giá ${r[1].toLocaleString('vi-VN')}</i></label><input id="i${k}" type="number" inputmode="numeric" min="0" data-k="${k}" value="${v[k]??''}" placeholder="0"><span class="amt" id="a${k}">0</span></div>`;
    });
    h+='</div>';
  });
    $('calc').innerHTML=h;
  $('calc').querySelectorAll('input').forEach(i=>i.addEventListener('input',e=>{vals[cur][e.target.dataset.k]=e.target.value;update()}));
  $('rs').onclick=()=>{vals[cur]={};renderCalc()};
  $('sv').onclick=save;
  update();
}
function update(){
  const c=cat(), r=compute(c);
  r.groups.forEach((g,gi)=>{$('s'+gi).textContent=fmt(g.sub);g.lines.forEach(l=>{$('a'+l.k).textContent=l.amt?l.amt.toLocaleString('vi-VN'):'0'})});
  $('tt').textContent=fmt(r.total);
}
function save(){
  const c=cat(), r=compute(c);
  if(!r.total){toast('Hãy nhập số liệu trước khi lưu');return}
  const lines=[]; const v=vals[c.id];
  if(c.lop) lines.push([c.lop,num(v.lop),null]);
  r.groups.forEach((g,gi)=>{
    const gd=c.groups[gi];
    if(gd.lop) lines.push([gd.lop,g.lop,null]);
    g.lines.forEach(l=>{if(l.q)lines.push([l.l,l.q,l.amt])});
  });
  saved.unshift({id:Date.now(),cat:c.id,name:c.name,ts:new Date().toLocaleString('vi-VN'),total:r.total,lines});
  persist(); vals[c.id]={}; renderCalc(); renderHist(); toast('Đã lưu kết quả #'+saved.length+' ✓','ok');
  }
function renderHist(){
  const sum=saved.reduce((a,b)=>a+b.total,0);
  $('gt').textContent=fmt(sum); $('cnt').textContent=saved.length+' lần đã lưu';
  $('chips').innerHTML=CATS.map(c=>{const t=saved.filter(x=>x.cat===c.id).reduce((a,b)=>a+b.total,0);return t?`<div class="chip" style="--tc:${COL[c.id]}">${c.name}<b>${fmt(t)}</b></div>`:''}).join('');
  const n=saved.length;
  $('hist').innerHTML=n?saved.map((s,i)=>`<div class="it" style="--tc:${COL[s.cat]}"><div class="top"><div class="no">${n-i}</div><div class="m"><div class="n">${s.name}</div><div class="t">${s.ts}</div></div><span class="v">${fmt(s.total)}</span></div><details><summary>Chi tiết</summary>${s.lines.map(l=>`<div><span>${l[0]}: ${l[1].toLocaleString('vi-VN')}</span><span>${l[2]==null?'':fmt(l[2])}</span></div>`).join('')}</details><button class="del" data-d="${s.id}">Xóa kết quả #${n-i}</button></div>`).join(''):'<div class="empty">Chưa có kết quả nào được lưu</div>';
  $('hist').querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{const k=saved.find(x=>x.id==b.dataset.d),no=saved.length-saved.indexOf(k);if(await ask('Xóa kết quả #'+no+'?',k.name+' · '+fmt(k.total)+'\nHành động này không thể hoàn tác.','Xóa kết quả')){saved=saved.filter(x=>x.id!=k.id);persist();renderHist();toast('Đã xóa kết quả')}});
}
$('clr').onclick=async()=>{if(saved.length&&await ask('Xóa toàn bộ?','Tất cả '+saved.length+' kết quả đã lưu ('+fmt(saved.reduce((a,b)=>a+b.total,0))+') sẽ bị xóa.\nHành động này không thể hoàn tác.','Xóa tất cả')){saved=[];persist();renderHist();toast('Đã xóa toàn bộ')}};
$('tabs').innerHTML=CATS.map((c,i)=>`<button class="tab" data-c="${c.id}" style="--tc:${COL[c.id]}"><span>${i+1}</span>${c.name}</button>`).join('');
function ask(title,msg,okText){return new Promise(res=>{
  const m=$('md');$('mt').textContent=title;$('mm').textContent=msg;$('mo').textContent=okText;m.classList.add('show');
  const done=v=>{m.classList.remove('show');$('mo').onclick=$('mc').onclick=m.onclick=null;document.onkeydown=null;res(v)};
  $('mo').onclick=()=>done(true);$('mc').onclick=()=>done(false);m.onclick=e=>{if(e.target===m)done(false)};
  document.onkeydown=e=>{if(e.key==='Escape')done(false)};$('mc').focus();});}
let tt;function toast(t,k){const e=$('toast');e.textContent=t;e.className='show '+(k||'');clearTimeout(tt);tt=setTimeout(()=>e.className='',2200)}
const closeNav=()=>document.body.classList.remove('open');
function tabs(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.c===cur))}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=t.dataset.c;tabs();renderCalc();closeNav();window.scrollTo({top:0})});
$('burger').onclick=()=>document.body.classList.toggle('open');
$('ov').onclick=closeNav;
tabs();renderCalc();renderHist();
</script>
</body>
</html>
